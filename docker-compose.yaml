services:
  web:
    image: denoland/deno:2.8.1
    restart: always
    user: '${HOST_UID}:${HOST_GID}'
    environment:
      DENO_DIR: /app/.deno-cache
    working_dir: /app
    command: >
      sh -c "deno task cron"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
  postgres:
    image: postgres:18.3
    restart: always
    ports:
      - ${PG_PORT}:5432
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata_compassReports:/var/lib/postgresql
      - ./init/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  pgdata_compassReports:
